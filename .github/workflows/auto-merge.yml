name: Fusion automatique des PR

# Toute Pull Request ouverte par quelqu'un ayant accès au dépôt est fusionnée
# sans intervention. On est deux sur ce projet : une PR sert à voir le diff et
# à déclencher le redéploiement, pas à s'attendre l'un l'autre.
#
# Conséquence à assumer : plus aucune relecture avant fusion. Pour garder une
# PR ouverte malgré tout, ouvrez-la en brouillon (« Draft ») — ce workflow les
# ignore, et « Ready for review » la fera fusionner.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fusionner:
    # Un brouillon reste ouvert. Et le dépôt étant public, on exige que
    # l'auteur ait réellement accès au dépôt : sans ça, la première PR venue
    # se fusionnerait toute seule dans main.
    if: >-
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Fusionner la Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          DEPOT: ${{ github.repository }}
        # Fusion directe, et non `--auto` : il n'y a aucun check obligatoire
        # sur ce dépôt, donc GitHub refuse l'auto-merge ("already in clean
        # status"). Surtout, une fusion différée par `--auto` tomberait après
        # l'étape d'estampillage ci-dessous, qui inscrirait alors le mauvais
        # commit. Si des checks sont ajoutés un jour, c'est ici qu'il faudra
        # revoir la logique.
        run: gh pr merge "$PR" --repo "$DEPOT" --merge --delete-branch

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Estampiller la version
        # Indispensable : GitHub ne déclenche aucun workflow sur un push fait
        # avec GITHUB_TOKEN. La fusion ci-dessus ne réveille donc pas
        # version.yml, et sans cette étape l'estampille resterait figée sur un
        # ancien commit alors que le site, lui, a bien été redéployé.
        run: .github/scripts/estampiller-version.sh
