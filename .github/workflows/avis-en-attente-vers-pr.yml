name: Avis en attente → Pull Request

# Le formulaire du site dépose un fichier JSON (un avis) sur la branche
# STAGING_BRANCH (js/data.js) via le lien "créer un nouveau fichier" de
# GitHub — aucune issue n'est créée. Dès que ce fichier arrive ici, on
# l'ajoute à js/reviews.js et on ouvre une Pull Request qui se fusionne
# toute seule.

on:
  push:
    branches: ["avis-en-attente-branche"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  creer-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la branche d'attente
        uses: actions/checkout@v4
        with:
          ref: avis-en-attente-branche
          fetch-depth: 0

      - name: Checkout de la branche par défaut
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vérifier les droits de l'auteur du push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NIVEAU=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [[ "$NIVEAU" != "admin" && "$NIVEAU" != "write" ]]; then
            echo "::error::${{ github.actor }} n'a pas les droits d'écriture sur le dépôt (niveau : $NIVEAU)."
            exit 1
          fi

      - name: Traiter les avis en attente
        id: traiter
        env:
          BASE_DIR: base
        run: node .github/scripts/traiter-avis-en-attente.mjs

      - name: Ouvrir la Pull Request
        if: steps.traiter.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          SUMMARY: ${{ steps.traiter.outputs.summary }}
        run: |
          set -euo pipefail
          cd base

          BRANCHE="avis/lot-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCHE"
          git add js/reviews.js
          git commit -m "$(printf 'Avis déposés depuis le site\n\n%s\n' "$SUMMARY")"
          git push -u origin "$BRANCHE"

          PR_URL=$(gh pr create \
            --base "$BASE" \
            --head "$BRANCHE" \
            --title "Avis déposés depuis le site" \
            --body "$(printf '%s\n\n%s\n' "Commentaire(s) déposé(s) depuis le site." "$SUMMARY")")

          echo "PR ouverte : $PR_URL"

          # Fusion directe, et non `--auto` : sans check obligatoire sur ce
          # dépôt, GitHub refuse l'auto-merge ("already in clean status") et
          # la PR resterait ouverte. Une fusion différée tomberait de toute
          # façon après l'estampillage de version ci-dessous, qui inscrirait
          # alors le mauvais commit. Si des checks sont ajoutés un jour, c'est
          # ici qu'il faudra revoir la logique.
          #
          # GitHub met parfois une seconde à calculer la fusionnabilité d'une
          # PR fraîchement créée : on réessaie avant d'abandonner.
          FUSIONNEE=false
          for _ in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              FUSIONNEE=true
              break
            fi
            echo "PR pas encore fusionnable, nouvelle tentative dans 5 s."
            sleep 5
          done

          if [[ "$FUSIONNEE" != "true" ]]; then
            gh issue create \
              --title "⚠️ Un avis n'a pas pu être fusionné" \
              --body "$(printf '%s\n\n%s\n' \
                "La Pull Request $PR_URL a été ouverte mais n'a pas pu être fusionnée automatiquement." \
                "Fusionnez-la à la main : le commentaire n'est pas encore en ligne.")"
            exit 1
          fi

      - name: Estampiller la version après fusion
        if: steps.traiter.outputs.has_changes == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: apres-fusion

      - name: Écrire js/version.js
        if: steps.traiter.outputs.has_changes == 'true'
        # Sans ça l'estampille du site resterait figée : GitHub ne déclenche
        # aucun workflow sur un push fait avec GITHUB_TOKEN, donc la fusion
        # ci-dessus ne réveille ni version.yml ni auto-merge.yml.
        working-directory: apres-fusion
        run: .github/scripts/estampiller-version.sh

      # Rien n'a été traité (push sans nouvel avis : création de la branche,
      # réalignement…) : il n'y a rien à nettoyer. L'ancienne version poussait
      # quand même, depuis un checkout où la branche par défaut n'existe pas
      # localement — le refspec échouait et une issue était ouverte pour rien.
      - name: Vider la file d'attente
        if: steps.traiter.outputs.has_changes == 'true' && steps.traiter.outputs.all_ok == 'true'
        # `apres-fusion` est un checkout de la branche par défaut, déjà
        # fusionné et estampillé : la file repart de là, vidée de ses avis.
        working-directory: apres-fusion
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/avis-en-attente-branche"

      # Des avis ont été rejetés : on ne retire que ceux qui sont passés, les
      # autres restent en attente d'une correction à la main.
      - name: Retirer seulement les avis traités
        if: steps.traiter.outputs.has_changes == 'true' && steps.traiter.outputs.all_ok != 'true'
        env:
          OK_FILES: ${{ steps.traiter.outputs.ok_files }}
        run: |
          set -euo pipefail
          [[ -n "$OK_FILES" ]] || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "$OK_FILES" | xargs -d '\n' git rm --
          git commit -m "Nettoyage : avis traités retirés de la file d'attente"
          git push origin HEAD:avis-en-attente-branche

      - name: Signaler les échecs de validation
        if: steps.traiter.outputs.all_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURES: ${{ steps.traiter.outputs.failures }}
        run: |
          gh issue create \
            --title "⚠️ Avis rejeté(s) dans la file d'attente" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Un ou plusieurs fichiers déposés dans \`avis-en-attente/\` n'ont pas pu être ajoutés :" \
              "$FAILURES" \
              "Corrigez ou supprimez ces fichiers sur la branche \`avis-en-attente-branche\` pour relancer le traitement.")"

      - name: Signaler l'échec du traitement
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "⚠️ Échec du traitement d'un avis en attente" \
            --body "Le workflow a échoué avant de terminer. Détail : $LOGS"
