name: Avis → Pull Request

# Quand une issue « avis » est ouverte depuis le site, on ajoute le commentaire
# à js/reviews.js et on ouvre une Pull Request. Il ne reste qu'à la fusionner.

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  creer-pr:
    # Deux garde-fous : le label « avis », et un auteur qui a réellement accès
    # au dépôt. Sans le second, n'importe qui pourrait déclencher une PR en
    # ouvrant une issue, le dépôt étant public.
    if: >-
      contains(github.event.issue.labels.*.name, 'avis') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ajouter l'avis à js/reviews.js
        id: avis
        # Le corps de l'issue passe par une variable d'environnement et jamais
        # dans la ligne de commande : c'est du texte arbitraire écrit par un
        # humain, il ne doit pas pouvoir être interprété par le shell.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/ajouter-avis.mjs

      - name: Ouvrir la Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
          GAME_ID: ${{ steps.avis.outputs.game_id }}
          AUTEUR: ${{ steps.avis.outputs.author }}
          NOTE: ${{ steps.avis.outputs.rating }}
        run: |
          set -euo pipefail

          BRANCHE="avis/issue-${NUMERO}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCHE"
          git add js/reviews.js
          git commit -m "Avis de ${AUTEUR} sur ${GAME_ID} (#${NUMERO})"
          git push -u origin "$BRANCHE"

          PR_URL=$(gh pr create \
            --base "$BASE" \
            --head "$BRANCHE" \
            --title "Avis de ${AUTEUR} sur ${GAME_ID}" \
            --body "$(printf '%s\n' \
              "Commentaire déposé depuis le site." \
              "" \
              "- **Jeu :** \`${GAME_ID}\`" \
              "- **Par :** ${AUTEUR}" \
              "- **Note :** ${NOTE}" \
              "" \
              "Le texte du commentaire est dans l'issue #${NUMERO} et dans le diff de \`js/reviews.js\`." \
              "" \
              "Closes #${NUMERO}")")

          echo "PR ouverte : $PR_URL"
          gh issue comment "$NUMERO" --body "✅ Pull Request ouverte automatiquement : $PR_URL"

      - name: Signaler l'échec dans l'issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMERO" --body "⚠️ La Pull Request n'a pas pu être créée automatiquement. Détail de l'erreur : $LOGS"
