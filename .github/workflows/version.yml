name: Estampiller la version du site

# Quand quelqu'un pousse ou fusionne sur main à la main, écrit dans
# js/version.js le commit déployé et la date, que le site affiche en haut à
# droite. GitHub Pages redéploie ensuite tout seul.
#
# Les fusions faites par le bot d'auto-merge ne passent PAS par ici : un push
# effectué avec GITHUB_TOKEN ne déclenche aucun workflow. C'est auto-merge.yml
# qui appelle le même script juste après avoir fusionné.

on:
  push:
    branches: [main]
    # Sans cette exclusion, le commit d'estampillage relancerait le workflow,
    # qui en produirait un autre, à l'infini.
    paths-ignore:
      - "js/version.js"

permissions:
  contents: write

# Si plusieurs fusions s'enchaînent, seule la dernière estampille compte.
concurrency:
  group: version-du-site
  cancel-in-progress: true

jobs:
  estampiller:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Écrire js/version.js
        run: .github/scripts/estampiller-version.sh
